<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Event Bubble handle through stopPropagation. -->
   <section id="sec">
    <ul id="list-container">
        <li id="list-1"><button>button-1</button></li>
        <li id="list-2"><button>button-2</button></li>
        <li id="list-3"><button>button-3</button></li>
        <li id="list-4"><button>button-4</button></li>
        <li id="list-5"><button>button-5</button></li>
        <li id="list-6"><button>button-6</button></li>
        <script>
           
            document.getElementById('list-container').addEventListener('click',()=>{
                console.log('button is clicked');
            })
            document.getElementById('list-4').addEventListener('click',(Event)=>{
                event.stopPropagation()
                console.log('button-4 is clicked');
            })
            document.getElementById('sec').addEventListener('click',()=>{
                console.log('button-sec is clicked');
            })
        </script>
    </ul>
   </section>
</body>
</html>
